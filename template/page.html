<!doctype html><html lang="{{lang}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><style>{{css}}</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9a90b5"/></marker></defs></svg>
<div class="top"><h1>{{heading}}</h1></div><header><nav aria-label="{{ui.toc}}"><div class="pkw"><button type="button" id="pkb" aria-haspopup="dialog" aria-expanded="false" aria-controls="pk"><span aria-hidden="true">☰</span> {{ui.pick}} <span id="pkc" class="pkc"></span></button><div id="pk" class="pk" role="dialog" aria-modal="false" aria-labelledby="pkt" hidden><div class="pkhd"><span id="pkt">{{ui.goto}}</span><a href="#intro" class="pkintro" data-s="intro">{{ui.to_start}}</a><button type="button" class="pkx" aria-label="{{ui.close}}">✕</button></div>{{picker}}</div><div id="pkbg" hidden></div></div></nav><div class="hd"><input id="q" type="search" aria-label="{{ui.search}}" autocomplete="off" placeholder="{{ui.search_placeholder}}"><span id="prog" aria-live="polite"></span><span id="pbar" aria-hidden="true"><i></i></span></div></header>
<main><p id="empty" role="status">{{ui.empty}}</p><section id="intro">{{intro}}</section>
{{sections}}
<p class="src">{{footer}}</p></main><script>const GG={{config}};
{{js}}</script></body></html>
